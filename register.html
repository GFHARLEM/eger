<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — NjoroNest</title>
  <meta name="description" content="Create a NjoroNest account to browse rooms, list properties, or manage the platform." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="auth-container">
  <div class="auth-card" style="max-width:480px;">
    <!-- Header -->
    <div class="auth-card-header">
      <div class="nav-logo">Njoro<span>Nest</span></div>
      <h2>Create Account</h2>
      <p>Join NjoroNest as a student or landlord</p>
    </div>

    <!-- Form -->
    <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
      <div class="auth-error" id="registerError"></div>

      <div class="form-group">
        <label for="reg-username">Username</label>
        <input type="text" id="reg-username" class="form-control" placeholder="e.g. Brian K." required />
      </div>

      <div class="form-group">
        <label for="reg-email">Email Address</label>
        <input type="email" id="reg-email" class="form-control" placeholder="you@example.com" required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" class="form-control" placeholder="Min 6 characters" required minlength="6" />
        </div>
        <div class="form-group">
          <label for="reg-confirm">Confirm Password</label>
          <input type="password" id="reg-confirm" class="form-control" placeholder="Repeat password" required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="reg-role">I am a</label>
          <select id="reg-role" class="form-control" required>
            <option value="student">Student</option>
            <option value="landlord">Landlord</option>
          </select>
        </div>
        <div class="form-group">
          <label for="reg-phone">Phone <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="07XXXXXXXX" />
        </div>
      </div>

      <button type="submit" class="auth-submit" id="registerBtn">🚀 Create Account</button>
    </form>

    <!-- Footer -->
    <div class="auth-footer">
      Already have an account? <a href="login.html">Sign in</a>
      <br><a href="index.html" style="font-weight:400; color: var(--muted);">← Back to NjoroNest</a>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:5000/api';

async function handleRegister(e) {
  e.preventDefault();
  const errorEl = document.getElementById('registerError');
  const btn     = document.getElementById('registerBtn');
  errorEl.classList.remove('show');

  const username = document.getElementById('reg-username').value.trim();
  const email    = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const confirm  = document.getElementById('reg-confirm').value;
  const role     = document.getElementById('reg-role').value;
  const phone    = document.getElementById('reg-phone').value.trim();

  // Validate
  if (!username || !email || !password || !confirm) {
    errorEl.textContent = 'Please fill in all required fields.';
    errorEl.classList.add('show');
    return;
  }
  if (password.length < 6) {
    errorEl.textContent = 'Password must be at least 6 characters.';
    errorEl.classList.add('show');
    return;
  }
  if (password !== confirm) {
    errorEl.textContent = 'Passwords do not match.';
    errorEl.classList.add('show');
    return;
  }

  btn.textContent = 'Creating account...';
  btn.disabled = true;

  try {
    const res  = await fetch(`${API}/auth/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password, role, phone: phone || undefined })
    });
    const data = await res.json();

    if (!data.success) {
      errorEl.textContent = data.message || 'Registration failed.';
      errorEl.classList.add('show');
      return;
    }

    // Success — redirect to login
    window.location.href = 'login.html?registered=1';

  } catch (err) {
    errorEl.textContent = 'Could not connect to server. Is it running?';
    errorEl.classList.add('show');
  } finally {
    btn.textContent = '🚀 Create Account';
    btn.disabled = false;
  }
}
</script>

</body>
</html>

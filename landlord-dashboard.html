<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landlord Dashboard — NjoroNest</title>
  <meta name="description" content="Manage your rental listings on NjoroNest. Add rooms, edit details, and track performance." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="dash-layout">

  <!-- ── HEADER ──────────────────────────────────────────────── -->
  <header class="dash-header">
    <div class="dash-header-left">
      <a href="index.html" class="nav-logo">Njoro<span>Nest</span></a>
      <span class="dash-role-badge">Landlord</span>
    </div>
    <div class="dash-header-right">
      <div class="dash-user-info">
        🏠 <strong id="dashUsername">Landlord</strong>
      </div>
      <a href="index.html" class="btn-logout" style="background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.12);">View Site</a>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </header>

  <!-- ── CONTENT ─────────────────────────────────────────────── -->
  <div class="dash-content">
    <div class="dash-welcome">
      <h1>Welcome, <span id="welcomeName">Landlord</span> 🏡</h1>
      <p>Manage your room listings. Add new rooms and track your existing properties.</p>
    </div>

    <!-- Stats -->
    <div class="dash-stats" id="landlordStats">
      <div class="dash-stat-card">
        <div class="dash-stat-num" id="myRoomCount">0</div>
        <div class="dash-stat-label">My Rooms</div>
      </div>
      <div class="dash-stat-card">
        <div class="dash-stat-num" id="myPhone">—</div>
        <div class="dash-stat-label">Phone on File</div>
      </div>
    </div>

    <!-- Add New Room Form -->
    <div class="dash-section">
      <h2>➕ Add New Room</h2>
      <form id="addRoomForm" onsubmit="handleAddRoom(event)">
        <div class="form-group">
          <label>Room Title</label>
          <input type="text" id="ar-title" class="form-control" placeholder="e.g. Spacious Bedsitter — Njoro Town" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Room Type</label>
            <select id="ar-type" class="form-control">
              <option value="bedsitter">Bedsitter</option>
              <option value="single">Single Room</option>
              <option value="one-bedroom">1 Bedroom</option>
              <option value="shared">Shared Room</option>
              <option value="airbnb">Airbnb</option>
            </select>
          </div>
          <div class="form-group">
            <label>Price (KES)</label>
            <input type="number" id="ar-price" class="form-control" placeholder="e.g. 5000" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Pricing Model</label>
            <select id="ar-pricing" class="form-control">
              <option value="monthly">Per Month</option>
              <option value="nightly">Per Night</option>
              <option value="daily">Per Day</option>
            </select>
          </div>
          <div class="form-group">
            <label>Min Stay (days)</label>
            <input type="number" id="ar-minstay" class="form-control" value="1" min="1" />
          </div>
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" id="ar-location" class="form-control" placeholder="e.g. Njoro Town, near Total petrol" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Distance from Gate</label>
            <input type="text" id="ar-distance" class="form-control" placeholder="e.g. 5 min walk" />
          </div>
          <div class="form-group">
            <label>Amenities</label>
            <input type="text" id="ar-amenities" class="form-control" placeholder="Water, WiFi, Security" />
          </div>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="ar-description" class="form-control" rows="3" placeholder="Describe the room — size, condition, rules..."></textarea>
        </div>
        <div class="form-group">
          <label>Room Photos <span style="font-weight:400;color:var(--muted)">(max 4, optional)</span></label>
          <input type="file" id="ar-photos" accept="image/*" multiple style="font-size:0.85rem;" />
        </div>
        <button type="submit" class="auth-submit" id="addRoomBtn">📋 Add Room</button>
      </form>
    </div>

    <!-- My Rooms List -->
    <div class="dash-section">
      <h2>📦 My Rooms</h2>
      <div id="myRoomsList">
        <div class="dash-empty">Loading your rooms...</div>
      </div>
    </div>
  </div>
</div>

<!-- ── EDIT ROOM MODAL ────────────────────────────────────────── -->
<div class="modal-overlay" id="editModal" onclick="if(event.target===this){closeEditModal();}">
  <div class="modal">
    <div class="modal-header">
      <h3>Edit Room</h3>
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-id" />
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="edit-title" class="form-control" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Type</label>
          <select id="edit-type" class="form-control">
            <option value="bedsitter">Bedsitter</option>
            <option value="single">Single Room</option>
            <option value="one-bedroom">1 Bedroom</option>
            <option value="shared">Shared Room</option>
            <option value="airbnb">Airbnb</option>
          </select>
        </div>
        <div class="form-group">
          <label>Price (KES)</label>
          <input type="number" id="edit-price" class="form-control" />
        </div>
      </div>
      <div class="form-group">
        <label>Location</label>
        <input type="text" id="edit-location" class="form-control" />
      </div>
      <div class="form-group">
        <label>Amenities</label>
        <input type="text" id="edit-amenities" class="form-control" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="edit-description" class="form-control" rows="3"></textarea>
      </div>
      <button class="auth-submit" onclick="submitEdit()">💾 Save Changes</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'http://localhost:3000/api';
let currentUser = null;

// ── AUTH GUARD ────────────────────────────────────────────────
(function() {
  const user = JSON.parse(localStorage.getItem('njoronest_user') || 'null');
  const token = localStorage.getItem('njoronest_token');
  if (!user || !token || user.role !== 'landlord') {
    window.location.href = 'login.html';
    return;
  }
  currentUser = user;
  document.getElementById('dashUsername').textContent = user.username;
  document.getElementById('welcomeName').textContent = user.username;
  document.getElementById('myPhone').textContent = user.phone || '—';
  loadMyRooms();
})();

function getToken() { return localStorage.getItem('njoronest_token'); }

function logout() {
  localStorage.removeItem('njoronest_token');
  localStorage.removeItem('njoronest_user');
  window.location.href = 'login.html';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}

// ── LOAD MY ROOMS ────────────────────────────────────────────
async function loadMyRooms() {
  try {
    const res  = await fetch(`${API}/landlord/my-rooms`, {
      headers: { 'Authorization': 'Bearer ' + getToken() }
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.message);

    const rooms = data.rooms;
    document.getElementById('myRoomCount').textContent = rooms.length;

    if (rooms.length === 0) {
      document.getElementById('myRoomsList').innerHTML = '<div class="dash-empty">You haven\'t listed any rooms yet. Use the form above to add your first room!</div>';
      return;
    }

    const html = `
      <div style="overflow-x:auto;">
        <table class="dash-table">
          <thead>
            <tr><th>Title</th><th>Type</th><th>Price</th><th>Location</th><th>Actions</th></tr>
          </thead>
          <tbody>
            ${rooms.map(r => `
              <tr>
                <td><strong>${escHtml(r.title)}</strong></td>
                <td>${r.type}</td>
                <td>KES ${Number(r.price).toLocaleString()}</td>
                <td>${escHtml(r.location)}</td>
                <td>
                  <button class="btn-sm btn-sm-green" onclick='openEditModal(${JSON.stringify(r).replace(/'/g,"&#39;")})'>Edit</button>
                  <button class="btn-danger" onclick="deleteRoom(${r.id})">Delete</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
    document.getElementById('myRoomsList').innerHTML = html;
  } catch (err) {
    document.getElementById('myRoomsList').innerHTML = '<div class="dash-empty">Could not load rooms. Is the server running?</div>';
  }
}

// ── ADD NEW ROOM ─────────────────────────────────────────────
async function handleAddRoom(e) {
  e.preventDefault();
  const btn = document.getElementById('addRoomBtn');
  btn.textContent = 'Adding...';
  btn.disabled = true;

  const formData = new FormData();
  formData.append('title', document.getElementById('ar-title').value.trim());
  formData.append('type', document.getElementById('ar-type').value);
  formData.append('price', document.getElementById('ar-price').value);
  formData.append('pricing_model', document.getElementById('ar-pricing').value);
  formData.append('min_stay_days', document.getElementById('ar-minstay').value);
  formData.append('location', document.getElementById('ar-location').value.trim());
  formData.append('distance', document.getElementById('ar-distance').value.trim());
  formData.append('amenities', document.getElementById('ar-amenities').value.trim());
  formData.append('description', document.getElementById('ar-description').value.trim());

  const photos = document.getElementById('ar-photos').files;
  for (let i = 0; i < Math.min(photos.length, 4); i++) {
    formData.append('photos', photos[i]);
  }

  try {
    const res  = await fetch(`${API}/rooms`, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + getToken() },
      body: formData
    });
    const data = await res.json();

    if (data.success) {
      showToast('✅ Room added successfully!');
      document.getElementById('addRoomForm').reset();
      loadMyRooms();
    } else {
      showToast('⚠️ ' + data.message);
    }
  } catch (err) {
    showToast('❌ Could not add room. Is the server running?');
  } finally {
    btn.textContent = '📋 Add Room';
    btn.disabled = false;
  }
}

// ── EDIT ROOM ────────────────────────────────────────────────
function openEditModal(room) {
  document.getElementById('edit-id').value = room.id;
  document.getElementById('edit-title').value = room.title;
  document.getElementById('edit-type').value = room.type;
  document.getElementById('edit-price').value = room.price;
  document.getElementById('edit-location').value = room.location;
  document.getElementById('edit-amenities').value = room.amenities || '';
  document.getElementById('edit-description').value = room.description || '';
  document.getElementById('editModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('open');
  document.body.style.overflow = '';
}

async function submitEdit() {
  const roomId = document.getElementById('edit-id').value;
  const body = {
    title: document.getElementById('edit-title').value.trim(),
    type: document.getElementById('edit-type').value,
    price: document.getElementById('edit-price').value,
    location: document.getElementById('edit-location').value.trim(),
    amenities: document.getElementById('edit-amenities').value.trim(),
    description: document.getElementById('edit-description').value.trim()
  };

  try {
    const res = await fetch(`${API}/rooms/${roomId}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + getToken()
      },
      body: JSON.stringify(body)
    });
    const data = await res.json();

    if (data.success) {
      showToast('✅ Room updated!');
      closeEditModal();
      loadMyRooms();
    } else {
      showToast('⚠️ ' + data.message);
    }
  } catch (err) {
    showToast('❌ Could not update room.');
  }
}

// ── DELETE ROOM ──────────────────────────────────────────────
async function deleteRoom(id) {
  if (!confirm('Are you sure you want to delete this room?')) return;
  try {
    const res = await fetch(`${API}/landlord/rooms/${id}`, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + getToken() }
    });
    const data = await res.json();
    if (data.success) {
      showToast('✅ Room deleted.');
      loadMyRooms();
    } else {
      showToast('⚠️ ' + data.message);
    }
  } catch (err) {
    showToast('❌ Could not delete room.');
  }
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>

</body>
</html>

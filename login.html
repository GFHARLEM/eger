<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — NjoroNest</title>
  <meta name="description" content="Log in to your NjoroNest account to manage rooms, bookings, and reviews." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
    <!-- Header -->
    <div class="auth-card-header">
      <div class="nav-logo">Njoro<span>Nest</span></div>
      <h2>Welcome Back</h2>
      <p>Sign in to your account</p>
    </div>

    <!-- Form -->
    <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
      <div class="auth-error" id="loginError"></div>

      <div class="form-group">
        <label for="login-email">Email Address</label>
        <input type="email" id="login-email" class="form-control" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required />
      </div>

      <button type="submit" class="auth-submit" id="loginBtn">🔐 Sign In</button>
    </form>

    <!-- Footer -->
    <div class="auth-footer">
      Don't have an account? <a href="register.html">Create one here</a>
      <br><a href="index.html" style="font-weight:400; color: var(--muted);">← Back to NjoroNest</a>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:5000/api';

async function handleLogin(e) {
  e.preventDefault();
  const errorEl = document.getElementById('loginError');
  const btn     = document.getElementById('loginBtn');
  errorEl.classList.remove('show');

  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;

  if (!email || !password) {
    errorEl.textContent = 'Please fill in all fields.';
    errorEl.classList.add('show');
    return;
  }

  btn.textContent = 'Signing in...';
  btn.disabled = true;

  try {
    const res  = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (!data.success) {
      errorEl.textContent = data.message || 'Login failed.';
      errorEl.classList.add('show');
      return;
    }

    // Store token and user in localStorage
    localStorage.setItem('njoronest_token', data.token);
    localStorage.setItem('njoronest_user', JSON.stringify(data.user));

    // Redirect based on role
    const role = data.user.role;
    if (role === 'admin')    window.location.href = 'admin-dashboard.html';
    else if (role === 'landlord') window.location.href = 'landlord-dashboard.html';
    else                          window.location.href = 'student-dashboard.html';

  } catch (err) {
    errorEl.textContent = 'Could not connect to server. Is it running?';
    errorEl.classList.add('show');
  } finally {
    btn.textContent = '🔐 Sign In';
    btn.disabled = false;
  }
}

// If already logged in, redirect to dashboard
(function checkAuth() {
  const user = JSON.parse(localStorage.getItem('njoronest_user') || 'null');
  if (user && localStorage.getItem('njoronest_token')) {
    if (user.role === 'admin')    window.location.href = 'admin-dashboard.html';
    else if (user.role === 'landlord') window.location.href = 'landlord-dashboard.html';
    else                               window.location.href = 'student-dashboard.html';
  }
})();
</script>

</body>
</html>
